<h2>ゲームの規模感は？</h2>
<p class="subtitle">どのくらいのボリュームを想定していますか？</p>

<div class="options">
  <div class="option" data-choice="mini" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>ミニゲーム</h3>
      <p>1面のみ・敵を倒してスコアを稼ぐ。数分で遊べる。敵が無限に出てくるサバイバル型。</p>
    </div>
  </div>

  <div class="option" data-choice="stages" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>3〜5ステージ</h3>
      <p>ステージごとに敵や背景が変わる。最後にボス戦あり。数十分のプレイ時間。</p>
    </div>
  </div>

  <div class="option" data-choice="endless" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>エンドレスラン</h3>
      <p>スクロールし続けて、どこまで生き残れるかを競う。ハイスコア型。</p>
    </div>
  </div>
</div>
