<h2>操作方法は？</h2>
<p class="subtitle">どうやってダースベーダーを動かしますか？</p>

<div class="options">
  <div class="option" data-choice="keyboard" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>キーボード</h3>
      <p>← → でダッシュ回避、スペースでライトセーバー攻撃。PC向け。</p>
    </div>
  </div>

  <div class="option" data-choice="arrows" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>矢印キー ＋ Zキー</h3>
      <p>矢印で移動、Zで攻撃・フォース。レトロゲーム風の操作感。</p>
    </div>
  </div>

  <div class="option" data-choice="auto" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>自動スクロール ＋ クリック</h3>
      <p>横スクロールは自動、クリック／スペースで攻撃。シンプルで誰でも遊べる。</p>
    </div>
  </div>
</div>
