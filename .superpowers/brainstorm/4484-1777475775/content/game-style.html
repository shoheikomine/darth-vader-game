<h2>どんなゲームにする？</h2>
<p class="subtitle">ダースベーダーゲームのスタイルを選んでください</p>

<div class="cards">
  <div class="card" data-choice="shooter" onclick="toggleSelect(this)">
    <div class="card-image" style="background:#0a0a1a;display:flex;align-items:center;justify-content:center;height:140px;font-size:48px;flex-direction:column;gap:8px">
      🚀
      <div style="display:flex;gap:12px;font-size:24px">⚡⚡⚡</div>
    </div>
    <div class="card-body">
      <h3>A: シューティング</h3>
      <p>ダースベーダーが宇宙空間で敵X翼を撃墜。横スクロールシューター。</p>
    </div>
  </div>

  <div class="card" data-choice="saber" onclick="toggleSelect(this)">
    <div class="card-image" style="background:#0a0a1a;display:flex;align-items:center;justify-content:center;height:140px;font-size:48px;flex-direction:column;gap:8px">
      ⚔️
      <div style="color:#f00;font-size:20px;text-shadow:0 0 10px #f00">LIGHTSABER</div>
    </div>
    <div class="card-body">
      <h3>B: ライトセーバー格闘</h3>
      <p>ジェダイとのライトセーバー対決。タイミングよくブロック＆攻撃。</p>
    </div>
  </div>

  <div class="card" data-choice="force" onclick="toggleSelect(this)">
    <div class="card-image" style="background:#0a0a1a;display:flex;align-items:center;justify-content:center;height:140px;font-size:48px;flex-direction:column;gap:8px">
      🖤
      <div style="color:#8b5cf6;font-size:20px;text-shadow:0 0 10px #8b5cf6">THE FORCE</div>
    </div>
    <div class="card-body">
      <h3>C: フォース・サバイバー</h3>
      <p>ベーダーがフォースで敵を倒しながら廊下を進む。反射神経ゲーム。</p>
    </div>
  </div>

  <div class="card" data-choice="runner" onclick="toggleSelect(this)">
    <div class="card-image" style="background:#0a0a1a;display:flex;align-items:center;justify-content:center;height:140px;font-size:48px;flex-direction:column;gap:8px">
      🏃
      <div style="color:#f59e0b;font-size:20px;text-shadow:0 0 10px #f59e0b">RUNNER</div>
    </div>
    <div class="card-body">
      <h3>D: 横スクロールアクション</h3>
      <p>ベーダーが走り・ジャンプ・斬りながら帝国軍基地を進む。</p>
    </div>
  </div>
</div>
