<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Darth Vader Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
    canvas { display: block; border: 1px solid #1a1a3e; }
  </style>
</head>
<body>
<canvas id="gameCanvas" width="800" height="500"></canvas>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

// ゲーム状態: 'START' | 'PLAYING' | 'GAMEOVER'
let state = 'START';

// キー入力
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) {
    e.preventDefault();
  }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// --- Starfield ---
const STARS = [];
(function initStars() {
  for (let i = 0; i < 80; i++) {
    STARS.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.0 + 0.3,
      speed: Math.random() * 0.5 + 0.2, // layer1: slow
    });
  }
  for (let i = 0; i < 40; i++) {
    STARS.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.0 + 1.2,
      speed: Math.random() * 1.0 + 0.8, // layer2: fast
    });
  }
})();

// --- Vader ---
const vader = {
  x: 100,
  y: H / 2,
  w: 60,
  h: 80,
  speed: 5,       // px/frame at 60fps
  hp: 3,
  invincible: 0,  // 無敵時間（秒）
  flashTimer: 0,  // 白フラッシュタイマー（秒）
};

function updateVader(dt) {
  if (state !== 'PLAYING') return;
  if (keys['ArrowLeft'] || keys['ArrowUp']) vader.y -= vader.speed * 60 * dt;
  if (keys['ArrowRight'] || keys['ArrowDown']) vader.y += vader.speed * 60 * dt;
  vader.y = Math.max(vader.h / 2, Math.min(H - vader.h / 2, vader.y));
  if (vader.invincible > 0) vader.invincible -= dt;
  if (vader.flashTimer > 0) vader.flashTimer -= dt;
}

function drawVader() {
  const x = vader.x;
  const y = vader.y;
  const w = vader.w;
  const h = vader.h;

  ctx.save();
  if (vader.flashTimer > 0) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.filter = 'brightness(5)';
  }

  // 体（台形）
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.moveTo(x - w * 0.3, y - h * 0.5);
  ctx.lineTo(x + w * 0.3, y - h * 0.5);
  ctx.lineTo(x + w * 0.4, y + h * 0.5);
  ctx.lineTo(x - w * 0.4, y + h * 0.5);
  ctx.closePath();
  ctx.fill();

  // ヘルメット（楕円）
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.ellipse(x, y - h * 0.25, w * 0.28, h * 0.3, 0, 0, Math.PI * 2);
  ctx.fill();

  // マスク（赤い目）
  ctx.fillStyle = '#ff2020';
  ctx.shadowColor = '#ff0000';
  ctx.shadowBlur = 8;
  ctx.fillRect(x - 10, y - h * 0.3, 6, 4);
  ctx.fillRect(x + 4, y - h * 0.3, 6, 4);
  ctx.shadowBlur = 0;

  // マント
  ctx.fillStyle = '#0a0a0a';
  ctx.beginPath();
  ctx.moveTo(x - w * 0.4, y - h * 0.1);
  ctx.lineTo(x - w * 0.55, y + h * 0.5);
  ctx.lineTo(x + w * 0.55, y + h * 0.5);
  ctx.lineTo(x + w * 0.4, y - h * 0.1);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function updateStars(dt) {
  for (const s of STARS) {
    s.x -= s.speed * 60 * dt;
    if (s.x < 0) { s.x = W; s.y = Math.random() * H; }
  }
}

function drawStars() {
  for (const s of STARS) {
    const opacity = 0.5 + (s.speed - 0.2) / 1.6 * 0.4;
    ctx.fillStyle = `rgba(255,255,255,${opacity.toFixed(2)})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

function update(dt) {
  updateStars(dt);
  updateVader(dt);
}

function draw() {
  ctx.fillStyle = '#05050f';
  ctx.fillRect(0, 0, W, H);
  drawStars();
  drawVader();
}

let lastTime = null;
function loop(timestamp) {
  if (lastTime === null) { lastTime = timestamp; requestAnimationFrame(loop); return; }
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05); // 秒、最大50ms
  lastTime = timestamp;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
